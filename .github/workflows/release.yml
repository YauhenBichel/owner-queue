name: release

# When a GitHub Release is published (tag vX.Y.Z, the version in src/owner_queue/__init__.py):
#   1. the tests run, and the sdist and wheel are built once;
#   2. PyPI gets them, with trusted publishing (OIDC): no API token is stored anywhere;
#   3. a pull request in the Homebrew tap points the formula at that sdist, if the secret
#      HOMEBREW_TAP_TOKEN is set; without it the job only keeps the formula as a file to download;
#   4. npm gets the package (the same source and a small Node launcher), also with OIDC. It does
#      not wait for PyPI: the npm package carries the source itself.
# The owner's one-time setup for each of these, and what is never automated, is in RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: The tag matches the version of the package
        run: |
          version=$(PYTHONPATH=src python3 -c 'import owner_queue; print(owner_queue.__version__)')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - name: They hold only the intended files
        run: |
          uvx twine check --strict dist/*
          python3 scripts/check_package.py dist dist/*
      - name: The wheel installs and its command runs
        run: uvx --from dist/*.whl owner-queue --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/owner-queue/
    permissions:
      id-token: write              # PyPI trusted publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true      # a re-run after a later job failed

  homebrew:
    needs: pypi                    # the formula downloads the sdist from PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAP: YauhenBichel/homebrew-tap
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Find the sdist on PyPI
        run: |
          sdist=$(ls dist/owner_queue-*.tar.gz)
          name=$(basename "$sdist")
          version=${GITHUB_REF_NAME#v}
          sha=$(sha256sum "$sdist" | cut -d' ' -f1)
          # Up to 5 minutes: PyPI can take a moment to serve a new version.
          for attempt in $(seq 1 30); do
            url=$(curl -fsS "https://pypi.org/pypi/owner-queue/$version/json" \
              | jq -r --arg name "$name" --arg sha "$sha" '.urls[] | select(.filename == $name and .digests.sha256 == $sha) | .url' || true)
            if [ -n "$url" ]; then echo "PyPI serves $name (attempt $attempt)"; break; fi
            sleep 10
          done
          test -n "$url" || { echo "::error::PyPI does not serve $name with the checksum of the file built here"; exit 1; }
          { echo "SDIST=$sdist"; echo "SDIST_URL=$url"; echo "VERSION=$version"; } >> "$GITHUB_ENV"
      - name: Fill in the formula
        run: |
          python3 scripts/render_formula.py --sdist "$SDIST" --url "$SDIST_URL" -o "$RUNNER_TEMP/owner-queue.rb"
          ruby -c "$RUNNER_TEMP/owner-queue.rb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: ${{ runner.temp }}/owner-queue.rb
          if-no-files-found: error
      - name: Open a pull request in the tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so no pull request was opened in $TAP. The formula is the artifact homebrew-formula of this run; see RELEASING.md."
            exit 0
          fi
          export GH_TOKEN="$TAP_TOKEN"
          branch="formula/owner-queue-$VERSION"
          if [ -n "$(gh pr list --repo "$TAP" --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "$TAP already has a pull request from $branch; nothing to do"; exit 0
          fi
          gh repo clone "$TAP" "$RUNNER_TEMP/tap" -- --depth 1
          cd "$RUNNER_TEMP/tap"
          gh auth setup-git
          mkdir -p Formula
          cp "$RUNNER_TEMP/owner-queue.rb" Formula/owner-queue.rb
          if [ -z "$(git status --porcelain)" ]; then echo "the tap already has this formula; nothing to do"; exit 0; fi
          git switch -c "$branch"
          git add Formula/owner-queue.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "owner-queue $VERSION"
          git push origin "$branch"
          gh pr create --repo "$TAP" --head "$branch" --title "owner-queue $VERSION" \
            --body "Formula for owner-queue $VERSION, filled in by the release workflow of $GITHUB_REPOSITORY from the sdist on PyPI. Review and merge by hand."

  npm:
    needs: tests                   # does not wait for PyPI: the npm package carries the source itself
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/owner-queue
    permissions:
      id-token: write              # npm trusted publishing: no token is stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24         # trusted publishing needs Node 22.14 or later and npm 11.5.1 or later
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm is new enough for trusted publishing
        run: |
          have=$(npm --version)
          test "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" = 11.5.1 || { echo "::error::npm $have is older than 11.5.1, which trusted publishing needs"; exit 1; }
      - name: The tag matches the version in package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, npm package $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The launcher works and the tarball holds only the intended files
        run: |
          npm test
          python3 scripts/check_package.py npm
      - name: Publish to npm
        run: |
          if curl -fsS -o /dev/null "https://registry.npmjs.org/owner-queue/$VERSION"; then    # a re-run after a later job failed
            echo "owner-queue $VERSION is already on npm; nothing to do"; exit 0
          fi
          if npm publish 2> >(tee "$RUNNER_TEMP/npm-publish.log" >&2); then exit 0; fi
          if grep -Eq 'ENEEDAUTH|E401|E403|E404|OIDC|[Uu]nable to authenticate' "$RUNNER_TEMP/npm-publish.log"; then
            echo "::error::npm did not accept this workflow as a trusted publisher of owner-queue. See RELEASING.md, npm: the first version is published by hand, then the trusted publisher is added (repository owner-queue, workflow release.yml, environment npm). A trusted publisher that did not publish within 2 days of being added has expired and must be added again. Then re-run this job."
          else
            echo "::error::npm publish failed; see the log above"
          fi
          exit 1
